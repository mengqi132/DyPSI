# DyPSI (NeurIPS 2026) -- dataset configuration: turbulent_flow
# All paths are relative placeholders; override via CLI flags.

dataset:
  name: turbulent_flow
  # 2D turbulent channel-flow cross-section (velocity snapshots).
  raw_path: data/turbulent_flow/ch_2Dxysec.pickle
  grid_shape: [128, 48]          # H x W
  n_channels: 2                  # velocity (u, v)
  spatial_dims: 2
  field_description: "velocity"
  sensor_budgets: [30, 50, 100, 200]   # sensor counts evaluated at test time
  num_frames: null               # null = use all frames in the raw file

trajectory_optimization:
  # Teacher-guided differentiable sensor-trajectory optimization.
  teacher: physense              # external reconstructor (PhySense)
  n_sensors: 100                 # default; override with --num_sensors
  n_frames: 16                   # frames per optimized segment (= joint.seg_len)
  lambda_gp: 1.0e-4              # GP temporal-prior weight
  gamma_dyn: 0.1                 # dynamics (velocity/acceleration) penalty weight
  v_max: 4.0                     # max sensor speed (grid units / frame)
  a_max: 1.0                     # max sensor acceleration (grid units / frame^2)
  gp_length_scale: 4.0           # Matern-3/2 length scale, in frames
  gp_sigma: 1.0                  # GP signal standard deviation
  n_iterations: 500
  lr: 0.01
  n_recon_samples: 4             # reconstructor rollouts per optimization step
  euler_steps: 10                # teacher reconstructor Euler steps per rollout
  use_gradient_checkpointing: false
  init: random                   # random uniform initial sensor positions

ftm:
  # Shared-basis Functional Tucker factorization.
  # ranks = (R1, R2, R3) = (channel/modal rank, spatial ranks).
  phy:
    ranks: [16, 32, 16]
    omega: 20
    lr: 1.0e-3
    weight_decay: 1.0e-5
    tv_weight: 1.0e-6
    max_iters: 20000
    eval_interval: 1000
    grad_clip: 1.0
  sen:
    ranks: [8, 32, 16]
    omega: 30
    lr: 1.0e-3
    weight_decay: 1.0e-5
    tv_weight: 1.0e-6
    max_iters: 20000
    eval_interval: 1000
    grad_clip: 1.0

joint:
  # Joint latent: concatenated phy/sen FTM cores.
  seg_len: 16                    # T_seg
  k_obs: 4                       # observed prefix frames K_obs
  stride: 5                      # sliding-window stride for segment extraction
  spf_bandwidth: [1.5, 1.5]      # SPF kernel bandwidth, grid units per axis

diffusion:
  # EDM-style joint diffusion prior.
  unet:
    model_channels: 128
    channel_mult: [1, 2, 4, 4]
    num_blocks: 3
    num_temporal_latent: 16
    attn_resolutions: [12, 6]
    dropout: 0.1
  edm:
    sigma_min: 0.002
    sigma_max: 80.0
    rho: 7.0
    sigma_data: 0.5
    P_mean: -1.2                 # ln sigma ~ N(P_mean, P_std^2)
    P_std: 1.2
  training:
    optimizer: adam
    batch_size: 16               # segments per batch
    num_steps: 200000
    lr: 2.0e-4
    betas: [0.9, 0.999]
    warmup: 1000
    accumulation_steps: 1
    bf16: true                   # bfloat16 mixed precision
  gp:
    kernel: matern32
    length_scale: 4.0            # frames
    signal_var: 1.0
  history:
    # History-embedding conditioning; disabled by default.
    enabled: false
    hidden_dim: 256

sampling:
  # Conditional sampling of unobserved frames given the observed prefix.
  num_steps: 50                  # Heun sampler steps
  anchor: linear                 # prefix anchoring scheme
  heun: true
  zeta: 1.0                      # anchoring strength (anchor=harmonic ablation)
  use_nms: true                  # NMS filter before SPF top-k readout
  nms_size: 3
